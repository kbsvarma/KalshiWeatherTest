[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-weather"
version = "0.1.0"
description = "Phase 1 foundation for a settlement-truth weather trading research platform."
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kalshi_weather = ["schemas/*.json", "py.typed"]
